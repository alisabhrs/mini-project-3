<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trial B — Photo + Stamp Card | Fresh'd</title>
  <style>
    body { margin: 0; padding: 32px 16px; background: #0b0b0b; color: #f5f0e6; font-family: Arial, Helvetica, sans-serif; }
    h1 { font-size: 13px; letter-spacing: 3px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1100px; }
    .card { position: relative; border: 1px solid #444; border-radius: 14px; overflow: hidden; background: #111; }
    .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .stamp { position: absolute; top: 12px; right: 12px; width: 82px; height: 82px; border-radius: 50%;
      background: #c63e31; border: 3px dashed #f5f0e6; display: grid; place-content: center; text-align: center;
      font-weight: 900; transform: rotate(8deg); }
    .stamp strong { font-size: 24px; display: block; }
    .stamp span { font-size: 9px; letter-spacing: 1px; }
    .body { padding: 18px; }
    .body h2 { font-weight: 900; letter-spacing: -1px; font-size: 22px; margin: 0 0 4px; text-transform: uppercase; }
    .eyebrow { font-size: 10px; letter-spacing: 3px; color: #aaa69d; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; list-style: none; }
    .tags li { font-size: 12px; padding: 4px 10px; border-radius: 99px; }
    .have li { background: #8d9e26; color: #0b0b0b; }
    .need li { border: 1px dashed #c63e31; color: #f5f0e6; }
  </style>
</head>
<body>
  <h1>TRIAL B / PHOTO + STAMP CARD</h1>
  <div class="grid">
    <article class="card">
      <img src="../images/pantry.png" alt="">
      <div class="stamp"><strong>67%</strong><span>MATCH</span></div>
      <div class="body">
        <p class="eyebrow">BREAKFAST · 2 OF 3 INGREDIENTS</p>
        <h2>Spinach Omelette</h2>
        <p class="eyebrow">YOU HAVE</p>
        <ul class="tags have"><li>Egg</li><li>Spinach</li></ul>
        <p class="eyebrow">YOU NEED</p>
        <ul class="tags need"><li>Feta</li></ul>
      </div>
    </article>
  </div>
</body>
</html>
